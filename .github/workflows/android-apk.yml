# Builds the Android APK on every push to a branch, on a version tag (v0.0.1) and by hand, and uploads it
# as a workflow artifact (the run's Summary page > Artifacts > CardboardXR-apk). On a tag it's also
# attached to the tag's GitHub release. Signed with Unity's debug key, as local builds are, so it
# installs as a new app, not over a release signed with the project's own key.
#
# One-time setup, as for the iOS workflow: repo Settings > Secrets and variables > Actions, add
# UNITY_LICENSE (the contents of a Unity .ulf), UNITY_EMAIL and UNITY_PASSWORD. See
# https://game.ci/docs/github/activation
#
# Third-party actions are pinned to full commit SHAs (the comment is the tag it was resolved from).
name: Android APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to add the APK to a tag's release
    steps:
      # Unity's Android image and the Gradle build need more room than the runner leaves free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # As in the iOS workflow: game-ci only passes its own env vars into Docker, so the version goes
      # into ProjectSettings directly.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i -E "s/^( *)bundleVersion: .*/\1bundleVersion: $VERSION/" ProjectSettings/ProjectSettings.asset
          grep -q "^ *bundleVersion: $VERSION\$" ProjectSettings/ProjectSettings.asset || { echo "::error::bundleVersion not set"; exit 1; }

      # Unity's import of the project, kept between runs: the first build takes the longest.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: |
            Library-Android-

      - uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.6.8f1
          targetPlatform: Android
          buildMethod: ProjectBootstrap.StereoBuilder.BuildAndroid
          allowDirtyBuild: true

      # StereoBuilder.BuildAndroid writes Builds/CardboardXR.apk. Check it carries the Java plugins
      # (the app library's phone apps, and their screen in XR) and Shizuku, which Gradle adds.
      - name: Check the APK
        run: |
          ls -la Builds/CardboardXR.apk
          unzip -p Builds/CardboardXR.apk 'classes*.dex' > /tmp/classes.dex
          for name in CardboardXRApps CardboardXRScreen CardboardXRScreenService rikka/shizuku/Shizuku; do
            grep -q "$name" /tmp/classes.dex || { echo "::error::$name missing from the APK"; exit 1; }
          done
          cp Builds/CardboardXR.apk "CardboardXR-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CardboardXR-apk
          path: 'CardboardXR-*.apk'
          if-no-files-found: error

      # Adds the APK to the tag's release, creating it if missing. No body or generate_release_notes is
      # passed, so notes on a release made by hand are left alone.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: 'CardboardXR-*.apk'
